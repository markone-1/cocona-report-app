<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>作業日報OCR</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --ink: #1f2933; --sub: #616e7c; --line: #d9dee5;
    --accent: #0b63c5; --accent-ink: #ffffff; --ok: #1e7b3c; --warn: #9a5b00; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181d; --card: #1d232b; --ink: #e6e9ed; --sub: #9aa5b1; --line: #33404d;
      --accent: #4c9bf0; --accent-ink: #0b1220; --ok: #5cc27e; --warn: #e3a83c; --err: #f07167; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, "Noto Sans JP", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.35rem; margin: 4px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button, .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: 12px 16px; font-size: 1rem; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  label { display: block; font-size: .9rem; color: var(--sub); margin: 10px 0 4px; }
  input[type=text], input[type=password], textarea { width: 100%; padding: 10px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  textarea { font-family: ui-monospace, monospace; font-size: .85rem; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
  .thumb { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
  .thumb img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
  .thumb span { position: absolute; left: 4px; bottom: 4px; font-size: .75rem; background: rgba(0,0,0,.6); color: #fff; padding: 0 5px; border-radius: 4px; }
  .thumb button { position: absolute; right: 4px; top: 4px; padding: 2px 8px; font-size: .85rem; border-radius: 6px; }
  .muted { color: var(--sub); font-size: .9rem; }
  #log { font-size: .9rem; margin: 0; padding-left: 1.2em; }
  #log li.ok { color: var(--ok); } #log li.err { color: var(--err); }
  .warn { color: var(--warn); }
  details summary { cursor: pointer; font-weight: 600; }
  .hidden { display: none; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main>
  <h1>作業日報OCR</h1>

  <details class="card" id="settingsBox">
    <summary>設定（最初に1回だけ）</summary>
    <p class="muted">設定はこのタブレットのブラウザ内にだけ保存されます。</p>
    <label for="repo">処理用リポジトリ（ユーザー名/リポジトリ名）</label>
    <input type="text" id="repo" placeholder="markone-1/cocona-report" autocomplete="off">
    <label for="token">GitHub アクセストークン（このリポジトリ専用）</label>
    <input type="password" id="token" autocomplete="off">
    <label for="key">暗号鍵（GitHub の Secret「REPORT_KEY」と同じ値）</label>
    <input type="password" id="key" autocomplete="off">
    <div class="row" style="margin-top:12px">
      <button id="saveCfg" class="primary">保存</button>
      <button id="genKey">新しい暗号鍵を作る</button>
      <button id="cleanAll">GitHubに残った古いジョブを削除</button>
    </div>
    <div id="keyOut" class="hidden">
      <label>新しい暗号鍵（コピーして GitHub の Secret「REPORT_KEY」に登録）</label>
      <textarea id="keyText" rows="2" readonly></textarea>
    </div>
  </details>

  <section class="card">
    <h2>1. 伝票を撮影・選択</h2>
    <div class="row">
      <label class="btn" for="cam" style="margin:0;color:var(--ink)">カメラで撮影</label>
      <label class="btn" for="pick" style="margin:0;color:var(--ink)">画像を選ぶ</label>
      <button id="clearImgs">全部クリア</button>
    </div>
    <input type="file" id="cam" accept="image/*" capture="environment">
    <input type="file" id="pick" accept="image/*" multiple>
    <p class="muted" id="imgCount">画像 0 枚</p>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <section class="card">
    <h2>2. OCRしてExcelを作成</h2>
    <button id="run" class="primary" disabled>OCRしてExcelを作成</button>
    <p class="muted">画像は暗号化してから送信します。処理には1〜3分ほどかかります。終わるまでこの画面を開いたままにしてください。</p>
    <ol id="log"></ol>
  </section>

  <section class="card hidden" id="resultBox">
    <h2>3. 結果</h2>
    <p id="resultText"></p>
    <ul id="warnList" class="warn"></ul>
    <div class="row">
      <button id="saveXlsx" class="primary">Excelを保存</button>
      <button id="saveZip">画像をZIPで保存</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";
const API = "https://api.github.com";
const WORKFLOW = "report.yml";
const $ = (s) => document.querySelector(s);

// ── 設定（localStorage は使えない環境もあるので try/catch） ──
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
function cfg() { return { repo: store.get("repo"), token: store.get("token"), key: store.get("key") }; }
function loadCfg() {
  const c = cfg();
  $("#repo").value = c.repo; $("#token").value = c.token; $("#key").value = c.key;
  if (!c.repo || !c.token || !c.key) $("#settingsBox").open = true;
}
$("#saveCfg").onclick = () => {
  store.set("repo", $("#repo").value.trim());
  store.set("token", $("#token").value.trim());
  store.set("key", $("#key").value.trim());
  alert("保存しました");
  updateRun();
};
$("#genKey").onclick = () => {
  const k = b64(crypto.getRandomValues(new Uint8Array(32)));
  $("#key").value = k; $("#keyText").value = k; $("#keyOut").classList.remove("hidden");
};

// ── Base64 / 暗号（AES-256-GCM：先頭12バイト=IV） ──
function b64(u8) {
  let s = ""; const n = 0x8000;
  for (let i = 0; i < u8.length; i += n) s += String.fromCharCode.apply(null, u8.subarray(i, i + n));
  return btoa(s);
}
function unb64(s) {
  const bin = atob(s.replace(/\s/g, "")); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
async function aesKey() {
  const raw = unb64(cfg().key);
  if (raw.length !== 32) throw new Error("暗号鍵が不正です（設定を確認）");
  return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
}
async function encrypt(u8) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await aesKey(), u8));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function decrypt(u8) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8.subarray(0, 12) }, await aesKey(), u8.subarray(12)));
}

// ── GitHub API ──
async function gh(path, opt = {}) {
  const c = cfg();
  // 通信が固まったまま進まないのを防ぐ：90秒で打ち切ってエラー表示
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), 90000);
  let r;
  try {
    r = await fetch(API + `/repos/${c.repo}` + path, {
      method: opt.method || "GET", signal: ac.signal,
      headers: { Authorization: "Bearer " + c.token, Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28", ...(opt.body ? { "Content-Type": "application/json" } : {}) },
      body: opt.body ? JSON.stringify(opt.body) : undefined,
    });
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "通信が90秒応答しません（電波・Wi-Fiを確認）" : `通信できません（${e.message}）`);
  } finally {
    clearTimeout(timer);
  }
  if (!r.ok) {
    if (opt.allow404 && r.status === 404) return null;
    const t = await r.text();
    throw new Error(`GitHub ${r.status}: ${t.slice(0, 160)}`);
  }
  return r.status === 204 ? null : r.json();
}

// ── 画像（長辺2000pxのJPEGに縮小して保持） ──
let images = []; // {name, data: Uint8Array, url}
async function addFiles(files) {
  for (const f of files) {
    try {
      const bmp = await createImageBitmap(f);
      const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      const blob = await new Promise((res) => cv.toBlob(res, "image/jpeg", 0.88));
      images.push({ orig: f.name || "photo.jpg", data: new Uint8Array(await blob.arrayBuffer()), url: URL.createObjectURL(blob) });
    } catch (e) {
      alert(`${f.name} を読み込めませんでした（HEIC等は非対応）`);
    }
  }
  renderThumbs();
}
function renderThumbs() {
  images.forEach((im, i) => im.name = `p${String(i + 1).padStart(2, "0")}.jpg`);
  $("#thumbs").innerHTML = "";
  images.forEach((im, i) => {
    const d = document.createElement("div"); d.className = "thumb";
    d.innerHTML = `<img src="${im.url}" alt=""><span>${im.name}</span><button aria-label="削除">×</button>`;
    d.querySelector("button").onclick = () => { URL.revokeObjectURL(im.url); images.splice(i, 1); renderThumbs(); };
    $("#thumbs").appendChild(d);
  });
  $("#imgCount").textContent = `画像 ${images.length} 枚`;
  updateRun();
}
$("#cam").onchange = (e) => { addFiles([...e.target.files]); e.target.value = ""; };
$("#pick").onchange = (e) => { addFiles([...e.target.files]); e.target.value = ""; };
$("#clearImgs").onclick = () => { if (confirm("画像を全部クリアしますか？")) { images.forEach((im) => URL.revokeObjectURL(im.url)); images = []; renderThumbs(); } };

let busy = false;
let wakeLock = null;
function updateRun() { const c = cfg(); $("#run").disabled = busy || !images.length || !c.repo || !c.token || !c.key; }

// ── 進捗表示 ──
function log(msg, cls) { const li = document.createElement("li"); li.textContent = msg; if (cls) li.className = cls; $("#log").appendChild(li); return li; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ── 結果 ──
let result = null; // {xlsxName, xlsx: Uint8Array, ymd}
function download(name, u8, type) {
  const url = URL.createObjectURL(new Blob([u8], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}
$("#saveXlsx").onclick = () => result && download(result.xlsxName, result.xlsx,
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
$("#saveZip").onclick = async () => {
  if (!result) return;
  const zip = new JSZip(); const dir = zip.folder(result.ymd);
  images.forEach((im) => dir.file(`${im.name.replace(".jpg", "")}_${im.orig.replace(/\.[^.]+$/, "")}.jpg`, im.data));
  download(`${result.ymd}_images.zip`, await zip.generateAsync({ type: "uint8array" }), "application/zip");
};

// ── GitHubの後片付け（ブランチ＋実行記録） ──
async function cleanup(jobId, runId) {
  if (runId) await gh(`/actions/runs/${runId}`, { method: "DELETE", allow404: true });
  await gh(`/git/refs/heads/job/${jobId}`, { method: "DELETE", allow404: true });
}
$("#cleanAll").onclick = async () => {
  if (!confirm("GitHubに残っているジョブ（暗号化データ・実行記録）を削除しますか？\n（他のタブレットが処理中の可能性がある30分以内のジョブは残します）")) return;
  try {
    // ジョブID先頭の yyyymmddHHMMSS から作成時刻を求め、30分以上前のものだけ消す（複数台運用で他端末の処理中ジョブを消さない）
    const old = (ref) => {
      const m = ref.match(/job\/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})-/);
      if (!m) return true;
      const t = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime();
      return Date.now() - t > 30 * 60 * 1000;
    };
    const refs = ((await gh(`/git/matching-refs/heads/job/`)) || []).filter((r) => old(r.ref));
    for (const r of refs) await gh(`/git/${r.ref}`, { method: "DELETE", allow404: true });
    const runs = await gh(`/actions/workflows/${WORKFLOW}/runs?per_page=100`);
    let n = 0;
    for (const r of runs.workflow_runs) if (r.status === "completed") { await gh(`/actions/runs/${r.id}`, { method: "DELETE", allow404: true }); n++; }
    alert(`ブランチ ${refs.length} 件・実行記録 ${n} 件を削除しました`);
  } catch (e) { alert("削除に失敗: " + e.message); }
};

// ── メイン処理 ──
$("#run").onclick = async () => {
  busy = true; updateRun(); $("#log").innerHTML = ""; $("#resultBox").classList.add("hidden"); result = null;
  const now = new Date(); const p = (n) => String(n).padStart(2, "0");
  const jobId = `${now.getFullYear()}${p(now.getMonth() + 1)}${p(now.getDate())}${p(now.getHours())}${p(now.getMinutes())}${p(now.getSeconds())}-`
    + Math.random().toString(36).slice(2, 6).padEnd(4, "0");
  const branch = `job/${jobId}`;
  let runId = null;
  try {
    // 1) 暗号化してアップロード（1コミットで一時ブランチを作成）
    // 処理中に画面が消えると通信が止まるので、スリープを抑止（対応ブラウザのみ）
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
    const l1 = log("GitHub に接続中…");
    const main = await gh(`/git/ref/heads/main`);
    const base = await gh(`/git/commits/${main.object.sha}`);
    const tree = [];
    for (const [i, im] of images.entries()) {
      l1.textContent = `画像を暗号化して送信中… ${i + 1}/${images.length} 枚目`;
      const enc = await encrypt(im.data);
      const blob = await gh(`/git/blobs`, { method: "POST", body: { content: b64(enc), encoding: "base64" } });
      tree.push({ path: `in/${im.name}.enc`, mode: "100644", type: "blob", sha: blob.sha });
    }
    l1.textContent = "送信内容を確定中…";
    const t = await gh(`/git/trees`, { method: "POST", body: { base_tree: base.tree.sha, tree } });
    const c = await gh(`/git/commits`, { method: "POST", body: { message: `job ${jobId}`, tree: t.sha, parents: [main.object.sha] } });
    await gh(`/git/refs`, { method: "POST", body: { ref: `refs/heads/${branch}`, sha: c.sha } });
    l1.textContent = "送信完了"; l1.className = "ok";

    // 2) Actions を起動して完了を待つ
    await gh(`/actions/workflows/${WORKFLOW}/dispatches`, { method: "POST", body: { ref: branch, inputs: { job_id: jobId } } });
    const l2 = log("処理中…（起動待ち）");
    const t0 = Date.now(); let run = null;
    while (true) {
      await sleep(8000);
      const sec = Math.round((Date.now() - t0) / 1000);
      if (sec > 25 * 60) throw new Error("時間切れ（25分）");
      const rs = await gh(`/actions/workflows/${WORKFLOW}/runs?branch=${encodeURIComponent(branch)}&per_page=5`);
      run = rs.workflow_runs[0];
      if (!run) { l2.textContent = `処理中…（起動待ち ${sec}秒）`; continue; }
      runId = run.id;
      if (run.status === "completed") break;
      l2.textContent = `処理中…（${sec}秒経過）`;
    }
    if (run.conclusion !== "success") throw new Error(`処理に失敗しました（${run.conclusion}）。GitHub の Actions 画面で失敗した手順名を確認してください`);
    l2.textContent = "処理完了"; l2.className = "ok";

    // 3) 暗号化された結果を取得して復号
    const l3 = log("結果を受信中…");
    const ref = await gh(`/git/ref/heads/${branch}`);
    const head = await gh(`/git/commits/${ref.object.sha}`);
    const files = (await gh(`/git/trees/${head.tree.sha}?recursive=1`)).tree.filter((x) => x.path.startsWith("out/") && x.path.endsWith(".enc"));
    const get = async (sha) => decrypt(unb64((await gh(`/git/blobs/${sha}`)).content));
    const resF = files.find((x) => x.path === "out/result.json.enc");
    const xlsF = files.find((x) => x.path.endsWith(".xlsx.enc"));
    if (!resF || !xlsF) throw new Error("結果ファイルが見つかりません");
    const res = JSON.parse(new TextDecoder().decode(await get(resF.sha)));
    const xlsxName = xlsF.path.slice(4, -4);
    result = { xlsxName, xlsx: await get(xlsF.sha), ymd: xlsxName.slice(0, 8) };
    l3.textContent = "受信・復号完了"; l3.className = "ok";

    // 4) 結果表示＋Excelを自動保存
    const cnt = Object.entries(res.counts || {}).map(([k, v]) => `${k} ${v}件`).join("・");
    $("#resultText").textContent = `${xlsxName}（${cnt}）`;
    $("#warnList").innerHTML = "";
    for (const w of (res.warnings || [])) { const li = document.createElement("li"); li.textContent = w; $("#warnList").appendChild(li); }
    $("#resultBox").classList.remove("hidden");
    download(result.xlsxName, result.xlsx, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");

    // 5) GitHub から削除
    await cleanup(jobId, runId);
    log("GitHub から今回のデータと実行記録を削除しました", "ok");
  } catch (e) {
    log("エラー: " + e.message, "err");
    // 失敗時は暗号化データ（ブランチ）だけ消し、実行記録は原因調査用に残す（ログに顧客データは出ない）
    try { await cleanup(jobId, null); log("GitHub の今回のデータを削除しました（実行記録は原因確認用に残しています）", "ok"); }
    catch (e2) { log("削除にも失敗しました。設定の「GitHubに残った古いジョブを削除」を押してください", "err"); }
  } finally {
    busy = false; updateRun();
    try { await wakeLock?.release(); } catch {} wakeLock = null;
  }
};

loadCfg(); renderThumbs();
</script>
</body>
</html>
